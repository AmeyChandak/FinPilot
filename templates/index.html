<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>FinPilot | Personal Finance AI</title>

    <meta
        name="description"
        content="FinPilot - Personal Finance Decision Support Agent"
    >


    <style>

        /* =====================================================
           RESET
        ===================================================== */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        html,
        body {

            width: 100%;
            height: 100%;

        }


        body {

            font-family:
                Inter,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;

            overflow: hidden;

            background: #061426;

            color: white;

        }


        /* =====================================================
           MAIN SCREEN
        ===================================================== */

        .splash-screen {

            position: relative;

            width: 100vw;
            height: 100vh;

            min-height: 600px;

            overflow: hidden;

            display: flex;

            align-items: center;

            justify-content: center;

            background:

                radial-gradient(
                    circle at 50% 42%,
                    #183e66 0%,
                    #0e2947 25%,
                    #08192d 58%,
                    #040c17 100%
                );

        }


        /* =====================================================
           BACKGROUND GLOW
        ===================================================== */

        .background-glow {

            position: absolute;

            width: 650px;
            height: 650px;

            left: 50%;
            top: 45%;

            transform:
                translate(-50%, -50%);

            border-radius: 50%;

            background:

                radial-gradient(
                    circle,
                    rgba(59,130,246,0.20) 0%,
                    rgba(59,130,246,0.08) 38%,
                    transparent 70%
                );

            filter:
                blur(18px);

            animation:
                glowPulse
                4s
                ease-in-out
                infinite;

            pointer-events: none;

        }


        @keyframes glowPulse {

            0%,
            100% {

                transform:
                    translate(-50%, -50%)
                    scale(0.95);

                opacity:
                    0.65;

            }

            50% {

                transform:
                    translate(-50%, -50%)
                    scale(1.08);

                opacity:
                    1;

            }

        }


        /* =====================================================
           PARTICLES
        ===================================================== */

        .particles {

            position: absolute;

            inset: 0;

            pointer-events: none;

        }


        .particle {

            position: absolute;

            width: 3px;
            height: 3px;

            border-radius: 50%;

            background:
                rgba(255,255,255,0.45);

            animation:
                floatParticle
                linear
                infinite;

        }


        .particle:nth-child(1) {

            left: 15%;
            top: 75%;

            animation-duration: 8s;

        }


        .particle:nth-child(2) {

            left: 22%;
            top: 25%;

            animation-duration: 10s;

        }


        .particle:nth-child(3) {

            left: 80%;
            top: 21%;

            animation-duration: 9s;

        }


        .particle:nth-child(4) {

            left: 88%;
            top: 70%;

            animation-duration: 11s;

        }


        .particle:nth-child(5) {

            left: 67%;
            top: 82%;

            animation-duration: 8s;

        }


        .particle:nth-child(6) {

            left: 34%;
            top: 12%;

            animation-duration: 12s;

        }


        @keyframes floatParticle {

            0% {

                transform:
                    translateY(30px)
                    scale(0.4);

                opacity:
                    0;

            }

            25% {

                opacity:
                    0.7;

            }

            75% {

                opacity:
                    0.5;

            }

            100% {

                transform:
                    translateY(-120px)
                    scale(1);

                opacity:
                    0;

            }

        }


        /* =====================================================
           MAIN CONTENT
        ===================================================== */

        .splash-content {

            position: relative;

            z-index: 5;

            width: 100%;

            height: 100%;

            display: flex;

            flex-direction: column;

            align-items: center;

            justify-content: flex-start;

        }


        /* =====================================================
           BRAND
        ===================================================== */

        .brand {

            position: absolute;

            top: 13%;

            left: 50%;

            transform:
                translateX(-50%)
                translateY(-15px);

            display: flex;

            align-items: center;

            gap: 11px;

            opacity: 0;

            white-space: nowrap;

            animation:
                brandAppear
                0.8s
                ease
                forwards;

            animation-delay:
                0.15s;

        }


        .brand-icon {

            width: 42px;
            height: 42px;

            display: flex;

            align-items: center;
            justify-content: center;

            border-radius: 13px;

            background:

                linear-gradient(
                    135deg,
                    #3b82f6,
                    #6366f1
                );

            box-shadow:

                0 9px 24px
                rgba(59,130,246,0.30);

            font-size: 21px;

            font-weight: 900;

        }


        .brand-name {

            font-size: 21px;

            font-weight: 800;

            letter-spacing:
                -0.5px;

        }


        @keyframes brandAppear {

            to {

                opacity: 1;

                transform:
                    translateX(-50%)
                    translateY(0);

            }

        }


        /* =====================================================
           TAGLINE
        ===================================================== */

        .tagline {

            position: absolute;

            top: calc(13% + 54px);

            left: 50%;

            transform:
                translateX(-50%)
                translateY(10px);

            color:
                #9eb4ca;

            font-size: 12px;

            letter-spacing:
                0.3px;

            white-space: nowrap;

            opacity: 0;

            animation:
                taglineAppear
                0.8s
                ease
                forwards;

            animation-delay:
                0.45s;

        }


        @keyframes taglineAppear {

            to {

                opacity: 1;

                transform:
                    translateX(-50%)
                    translateY(0);

            }

        }


        /* =====================================================
           PIGGY STAGE
        ===================================================== */

        .piggy-stage {

            position: absolute;

            left: 50%;
            top: 52%;

            width: 380px;
            height: 330px;

            transform:
                translate(-50%, -50%);

        }


        /* =====================================================
           GROUND SHADOW
        ===================================================== */

        .ground-glow {

            position: absolute;

            left: 50%;

            bottom: 19px;

            width: 245px;
            height: 38px;

            transform:
                translateX(-50%);

            border-radius: 50%;

            background:
                rgba(59,130,246,0.25);

            filter:
                blur(16px);

            animation:
                groundPulse
                3s
                ease-in-out
                infinite;

        }


        @keyframes groundPulse {

            0%,
            100% {

                transform:
                    translateX(-50%)
                    scaleX(0.85);

                opacity:
                    0.45;

            }

            50% {

                transform:
                    translateX(-50%)
                    scaleX(1);

                opacity:
                    0.85;

            }

        }


        /* =====================================================
           PIGGY
        ===================================================== */

        .piggy-container {

            position: absolute;

            left: 50%;

            bottom: 28px;

            width: 285px;
            height: 260px;

            transform:
                translateX(-50%)
                translateY(35px)
                scale(0.88);

            opacity: 0;

            animation:

                piggyEnter
                0.9s
                cubic-bezier(
                    .2,
                    .9,
                    .3,
                    1.15
                )
                forwards,

                piggyShake
                0.55s
                ease-in-out
                3.05s;

        }


        @keyframes piggyEnter {

            0% {

                opacity: 0;

                transform:
                    translateX(-50%)
                    translateY(45px)
                    scale(0.82);

            }

            70% {

                transform:
                    translateX(-50%)
                    translateY(-6px)
                    scale(1.03);

            }

            100% {

                opacity: 1;

                transform:
                    translateX(-50%)
                    translateY(0)
                    scale(1);

            }

        }


        @keyframes piggyShake {

            0%,
            100% {

                transform:
                    translateX(-50%)
                    rotate(0deg);

            }

            20% {

                transform:
                    translateX(
                        calc(-50% - 4px)
                    )
                    rotate(-1deg);

            }

            40% {

                transform:
                    translateX(
                        calc(-50% + 4px)
                    )
                    rotate(1deg);

            }

            60% {

                transform:
                    translateX(
                        calc(-50% - 3px)
                    )
                    rotate(-0.7deg);

            }

            80% {

                transform:
                    translateX(
                        calc(-50% + 2px)
                    )
                    rotate(0.5deg);

            }

        }


        /* =====================================================
           SVG
        ===================================================== */

        .piggy-svg {

            width: 100%;
            height: 100%;

            overflow: visible;

            filter:
                drop-shadow(
                    0 18px 22px
                    rgba(0,0,0,0.28)
                );

        }


        /* =====================================================
           COIN
        ===================================================== */

        .coin {

            position: absolute;

            z-index: 30;

            left: 50%;

            top: -22px;

            width: 52px;
            height: 52px;

            transform:
                translateX(-50%);

            display: flex;

            align-items: center;
            justify-content: center;

            border-radius: 50%;

            color:
                #825000;

            font-size: 24px;

            font-weight: 900;

            background:

                linear-gradient(
                    145deg,
                    #fff5ad 0%,
                    #ffdb51 25%,
                    #f4b817 65%,
                    #d88e04 100%
                );

            border:
                4px solid
                #ffe681;

            box-shadow:

                0 6px 0
                #b67505,

                0 11px 22px
                rgba(0,0,0,0.35),

                inset 3px 3px 5px
                rgba(255,255,255,0.7),

                inset -4px -4px 7px
                rgba(145,82,0,0.25);

            opacity: 0;

            animation:

                coinFall
                2.7s
                cubic-bezier(
                    .22,
                    .75,
                    .25,
                    1
                )
                forwards;

            animation-delay:
                1.3s;

        }


        .coin::before {

            content: "";

            position: absolute;

            inset: 7px;

            border-radius: 50%;

            border:
                1.5px solid
                rgba(130,80,0,0.35);

        }


        .coin::after {

            content: "";

            position: absolute;

            left: 10px;
            top: 8px;

            width: 12px;
            height: 7px;

            border-radius: 50%;

            background:
                rgba(255,255,255,0.75);

            transform:
                rotate(-30deg);

        }


        @keyframes coinFall {

            0% {

                opacity: 0;

                transform:
                    translateX(-50%)
                    translateY(-35px)
                    rotate(-20deg)
                    scale(0.75);

            }

            8% {

                opacity: 1;

            }

            32% {

                transform:
                    translateX(-50%)
                    translateY(75px)
                    rotate(15deg)
                    scale(1);

            }

            53% {

                transform:
                    translateX(-50%)
                    translateY(155px)
                    rotate(-12deg)
                    scale(1.02);

            }

            67% {

                transform:
                    translateX(-50%)
                    translateY(205px)
                    rotate(8deg)
                    scale(1);

            }

            76% {

                transform:
                    translateX(-50%)
                    translateY(222px)
                    rotate(-5deg)
                    scale(0.86);

                opacity: 1;

            }

            85% {

                transform:
                    translateX(-50%)
                    translateY(241px)
                    rotate(4deg)
                    scale(0.55);

                opacity: 0.8;

            }

            94% {

                transform:
                    translateX(-50%)
                    translateY(258px)
                    scale(0.15);

                opacity: 0.12;

            }

            100% {

                transform:
                    translateX(-50%)
                    translateY(267px)
                    scale(0);

                opacity: 0;

            }

        }


        /* =====================================================
           IMPACT
        ===================================================== */

        .impact-ring {

            position: absolute;

            left: 50%;
            top: 210px;

            width: 65px;
            height: 65px;

            transform:
                translate(-50%, -50%)
                scale(0);

            border-radius: 50%;

            border:
                2px solid
                rgba(255,216,77,0.85);

            opacity: 0;

            z-index: 15;

            animation:
                impact
                0.7s
                ease-out
                forwards;

            animation-delay:
                2.98s;

        }


        @keyframes impact {

            0% {

                opacity: 0.9;

                transform:
                    translate(-50%, -50%)
                    scale(0.25);

            }

            100% {

                opacity: 0;

                transform:
                    translate(-50%, -50%)
                    scale(1.7);

            }

        }


        /* =====================================================
           LOADING AREA
           
           IMPORTANT:
           FIXED TO SCREEN BOTTOM CENTER
           SO IT CAN NEVER MOVE BESIDE THE PIGGY.
        ===================================================== */

        .loading-area {

            position: fixed;

            z-index: 50;

            left: 50%;

            bottom: 34px;

            width:
                min(
                    390px,
                    75vw
                );

            transform:
                translateX(-50%)
                translateY(12px);

            text-align: center;

            opacity: 0;

            animation:
                loadingAppear
                0.8s
                ease
                forwards;

            animation-delay:
                0.9s;

        }


        @keyframes loadingAppear {

            to {

                opacity: 1;

                transform:
                    translateX(-50%)
                    translateY(0);

            }

        }


        .loading-title {

            font-size:
                12px;

            font-weight:
                650;

            color:
                #dbe7f3;

            letter-spacing:
                0.15px;

        }


        .loading-subtitle {

            margin-top:
                5px;

            font-size:
                10px;

            color:
                #708aa4;

        }


        /* =====================================================
           PROGRESS
        ===================================================== */

        .progress-track {

            position: relative;

            width: 100%;

            height: 3px;

            margin-top:
                12px;

            border-radius:
                20px;

            background:
                rgba(
                    255,
                    255,
                    255,
                    0.08
                );

            overflow: hidden;

        }


        .progress-bar {

            width: 0%;

            height: 100%;

            border-radius:
                inherit;

            background:

                linear-gradient(
                    90deg,
                    #3b82f6,
                    #6366f1,
                    #8b5cf6
                );

            box-shadow:

                0 0 10px
                rgba(
                    99,
                    102,
                    241,
                    0.5
                );

            animation:
                progress
                4.1s
                ease
                forwards;

        }


        @keyframes progress {

            from {
                width: 0%;
            }

            to {
                width: 100%;
            }

        }


        /* =====================================================
           RESPONSIVE
        ===================================================== */

        @media (max-width: 600px) {

            .brand {

                top:
                    10%;

            }


            .tagline {

                top:
                    calc(10% + 54px);

                font-size:
                    10px;

            }


            .piggy-stage {

                top:
                    50%;

                transform:
                    translate(-50%, -50%)
                    scale(0.82);

            }


            .loading-area {

                bottom:
                    25px;

                width:
                    80vw;

            }

        }


        @media (max-height: 700px) {

            .brand {

                top:
                    8%;

            }


            .tagline {

                top:
                    calc(8% + 54px);

            }


            .piggy-stage {

                top:
                    49%;

                transform:
                    translate(-50%, -50%)
                    scale(0.72);

            }


            .loading-area {

                bottom:
                    18px;

            }

        }

    </style>

</head>
