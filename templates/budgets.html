<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>FinPilot | Budgets</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #f8fafc;
            font-family: Arial, sans-serif;
        }

        .page-wrapper {
            min-height: 100vh;
        }

        /* ==============================
           TOP BAR
        ============================== */

        .top-bar {
            height: 72px;
            background: white;
            border-bottom: 1px solid #e5e7eb;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 30px;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .brand-logo {
            width: 38px;
            height: 38px;
            background: #111827;
            color: white;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 17px;
        }

        .brand-name {
            font-size: 21px;
            font-weight: 700;
            color: #111827;
        }

        /* ==============================
           PROFILE
        ============================== */

        .profile-wrapper {
            position: relative;
        }

        .profile-btn {
            border: 1px solid #e5e7eb;
            background: white;
            border-radius: 12px;
            padding: 8px 12px;
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            transition: 0.2s;
        }

        .profile-btn:hover {
            background: #f8fafc;
        }

        .profile-avatar {
            width: 36px;
            height: 36px;
            background: #111827;
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 14px;
        }

        .profile-info {
            text-align: left;
            line-height: 1.2;
        }

        .profile-name {
            font-size: 14px;
            font-weight: 700;
            color: #111827;
        }

        .profile-email {
            font-size: 11px;
            color: #64748b;
            margin-top: 3px;
        }

        .profile-arrow {
            font-size: 12px;
            color: #64748b;
        }

        .profile-menu {
            position: absolute;
            top: calc(100% + 10px);
            right: 0;
            width: 220px;
            background: white;
            border: 1px solid #e5e7eb;
            border-radius: 14px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.10);
            padding: 8px;
            display: none;
        }

        .profile-menu.show {
            display: block;
        }

        .profile-menu-header {
            padding: 12px;
            border-bottom: 1px solid #f1f5f9;
            margin-bottom: 5px;
        }

        .profile-menu-header strong {
            display: block;
            font-size: 14px;
            color: #111827;
        }

        .profile-menu-header span {
            display: block;
            margin-top: 4px;
            font-size: 12px;
            color: #64748b;
            word-break: break-word;
        }

        .profile-menu a {
            display: block;
            text-decoration: none;
            color: #111827;
            padding: 11px 12px;
            border-radius: 9px;
            font-size: 14px;
            transition: 0.2s;
        }

        .profile-menu a:hover {
            background: #f3f4f6;
        }

        .profile-menu a.logout-link {
            color: #dc2626;
        }

        .profile-menu a.logout-link:hover {
            background: #fef2f2;
        }

        /* ==============================
           PAGE
        ============================== */

        .budget-page {
            padding: 30px;
            max-width: 1200px;
            margin: auto;
        }

        .budget-header {
            margin-bottom: 25px;
        }

        .budget-header h1 {
            margin: 0;
            color: #111827;
        }

        .budget-header p {
            color: #64748b;
            margin-top: 8px;
        }

        /* ==============================
           FORM
        ============================== */

        .budget-form {
            background: white;
            padding: 24px;
            border-radius: 18px;
            box-shadow: 0 5px 25px rgba(0, 0, 0, 0.06);
            margin-bottom: 25px;
        }

        .budget-form h2 {
            margin-top: 0;
            margin-bottom: 20px;
        }

        .form-row {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 7px;
            color: #374151;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            box-sizing: border-box;
            padding: 12px;
            border: 1px solid #d1d5db;
            border-radius: 10px;
            font-size: 14px;
            background: white;
            outline: none;
        }

        .form-group input:focus,
        .form-group select:focus {
            border-color: #111827;
        }

        .save-budget {
            margin-top: 20px;
            background: #111827;
            color: white;
            border: none;
            padding: 12px 22px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
        }

        .save-budget:hover {
            opacity: 0.9;
        }

        .save-budget:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        /* ==============================
           GRID
        ============================== */

        .budget-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
        }

        .budget-card {
            background: white;
            padding: 22px;
            border-radius: 18px;
            box-shadow: 0 5px 25px rgba(0, 0, 0, 0.06);
        }

        .budget-card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .budget-card-header h3 {
            margin: 0;
            font-size: 19px;
            color: #111827;
        }

        .delete-budget {
            border: none;
            background: #fee2e2;
            color: #991b1b;
            padding: 8px 10px;
            border-radius: 8px;
            cursor: pointer;
        }

        .delete-budget:hover {
            background: #fecaca;
        }

        .budget-numbers {
            display: flex;
            justify-content: space-between;
            margin: 22px 0 12px;
        }

        .budget-number small {
            display: block;
            color: #64748b;
            margin-bottom: 5px;
        }

        .budget-number strong {
            font-size: 19px;
            color: #111827;
        }

        .progress-container {
            height: 10px;
            background: #e5e7eb;
            border-radius: 20px;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            border-radius: 20px;
            transition: width 0.4s ease;
        }

        .safe {
            background: #22c55e;
        }

        .warning {
            background: #f59e0b;
        }

        .danger {
            background: #ef4444;
        }

        .budget-status {
            margin-top: 13px;
            font-weight: 600;
            font-size: 14px;
            color: #374151;
        }

        .month-label {
            color: #64748b;
            font-size: 13px;
            margin-top: 12px;
        }

        /* ==============================
           EMPTY STATE
        ============================== */

        .empty-state {
            background: white;
            padding: 55px;
            text-align: center;
            border-radius: 18px;
            color: #64748b;
        }

        .empty-state h3 {
            color: #111827;
        }

        /* ==============================
           ERROR
        ============================== */

        .error-message {
            display: none;
            background: #fee2e2;
            color: #991b1b;
            padding: 12px;
            border-radius: 10px;
            margin-top: 15px;
        }

        /* ==============================
           LOADING
        ============================== */

        .loading-state {
            background: white;
            padding: 40px;
            text-align: center;
            border-radius: 18px;
            color: #64748b;
        }

        /* ==============================
           MOBILE
        ============================== */

        @media (max-width: 700px) {

            .top-bar {
                padding: 0 15px;
            }

            .profile-info {
                display: none;
            }

            .profile-btn {
                padding: 6px;
            }

            .budget-page {
                padding: 18px;
            }

            .form-row {
                grid-template-columns: 1fr;
            }

            .budget-numbers {
                gap: 20px;
            }
        }
    </style>

</head>

<body>

<div class="page-wrapper">

    <!-- ================================= -->
    <!-- TOP BAR -->
    <!-- ================================= -->

    <div class="top-bar">

        <div class="brand">

            <div class="brand-logo">
                FP
            </div>

            <div class="brand-name">
                FinPilot
            </div>

        </div>


        <!-- ================================= -->
        <!-- PROFILE DROPDOWN -->
        <!-- ================================= -->

        <div class="profile-wrapper">

            <button
                class="profile-btn"
                id="profileBtn"
                type="button"
                onclick="toggleProfileMenu()"
            >

                <div
                    class="profile-avatar"
                    id="profileAvatar"
                >
                    U
                </div>

                <div class="profile-info">

                    <div
                        class="profile-name"
                        id="profileName"
                    >
                        {{ session.get('user_name', 'User') }}
                    </div>

                    <div
                        class="profile-email"
                        id="profileEmail"
                    >
                        {{ session.get('user_email', '') }}
                    </div>

                </div>

                <div class="profile-arrow">
                    ▼
                </div>

            </button>


            <div
                class="profile-menu"
                id="profileMenu"
            >

                <div class="profile-menu-header">

                    <strong>
                        {{ session.get('user_name', 'User') }}
                    </strong>

                    <span>
                        {{ session.get('user_email', '') }}
                    </span>

                </div>

                <a href="/profile">
                    👤 Profile
                </a>

                <a
                    href="/logout"
                    class="logout-link"
                >
                    🚪 Logout
                </a>

            </div>

        </div>

    </div>


    <!-- ================================= -->
    <!-- PAGE -->
    <!-- ================================= -->

    <div class="budget-page">

        <!-- ================================= -->
        <!-- HEADER -->
        <!-- ================================= -->

        <div class="budget-header">

            <h1>
                💰 Budgets
            </h1>

            <p>
                Set spending limits and track your actual spending.
            </p>

        </div>


        <!-- ================================= -->
        <!-- BUDGET FORM -->
        <!-- ================================= -->

        <div class="budget-form">

            <h2>
                Set Monthly Budget
            </h2>


            <div class="form-row">

                <div class="form-group">

                    <label>
                        Category
                    </label>

                    <select id="budgetCategory">

                        <option value="Food">
                            Food
                        </option>

                        <option value="Shopping">
                            Shopping
                        </option>

                        <option value="Transport">
                            Transport
                        </option>

                        <option value="Entertainment">
                            Entertainment
                        </option>

                        <option value="Bills">
                            Bills
                        </option>

                        <option value="Rent">
                            Rent
                        </option>

                        <option value="Education">
                            Education
                        </option>

                        <option value="Healthcare">
                            Healthcare
                        </option>

                        <option value="Other">
                            Other
                        </option>

                    </select>

                </div>


                <div class="form-group">

                    <label>
                        Monthly Budget
                    </label>

                    <input
                        type="number"
                        id="budgetAmount"
                        placeholder="5000"
                        min="1"
                        step="0.01"
                    >

                </div>


                <div class="form-group">

                    <label>
                        Month
                    </label>

                    <input
                        type="month"
                        id="budgetMonth"
                    >

                </div>

            </div>


            <button
                class="save-budget"
                id="saveBudgetButton"
                onclick="saveBudget()"
                type="button"
            >
                💾 Save Budget
            </button>


            <div
                id="errorMessage"
                class="error-message"
            ></div>

        </div>


        <!-- ================================= -->
        <!-- BUDGET CARDS -->
        <!-- ================================= -->

        <div
            id="loadingState"
            class="loading-state"
        >
            Loading budgets...
        </div>

        <div
            id="budgetGrid"
            class="budget-grid"
            style="display:none;"
        ></div>


        <!-- ================================= -->
        <!-- EMPTY -->
        <!-- ================================= -->

        <div
            id="emptyState"
            class="empty-state"
            style="display:none;"
        >

            <h3>
                No budgets yet
            </h3>

            <p>
                Create your first monthly budget above.
            </p>

        </div>

    </div>

</div>


<script>

    let budgets = [];

    let transactions = [];


    /* ==========================================
       PROFILE DROPDOWN
    ========================================== */

    function toggleProfileMenu() {

        const menu =
            document.getElementById("profileMenu");

        menu.classList.toggle("show");
    }


    document.addEventListener("click", function(event) {

        const wrapper =
            document.querySelector(".profile-wrapper");

        const menu =
            document.getElementById("profileMenu");

        if (
            wrapper &&
            !wrapper.contains(event.target)
        ) {

            menu.classList.remove("show");
        }

    });


    /* ==========================================
       PROFILE INITIALS
    ========================================== */

    function setProfileInitial() {

        const name =
            document.getElementById("profileName")
                ?.innerText
                ?.trim();

        const avatar =
            document.getElementById("profileAvatar");

        if (!avatar) {
            return;
        }

        if (!name) {
            avatar.innerText = "U";
            return;
        }

        const words =
            name.split(/\s+/);

        let initials = "";

        if (words.length === 1) {

            initials =
                words[0]
                    .substring(0, 2)
                    .toUpperCase();

        } else {

            initials =
                (
                    words[0][0] +
                    words[words.length - 1][0]
                ).toUpperCase();

        }

        avatar.innerText =
            initials || "U";
    }


    /* ==========================================
       FORMAT MONEY
    ========================================== */

    function formatMoney(amount) {

        return "₹" +
            Number(
                amount || 0
            ).toLocaleString(
                "en-IN",
                {
                    maximumFractionDigits: 2
                }
            );

    }


    /* ==========================================
       CURRENT MONTH
    ========================================== */

    function setCurrentMonth() {

        const input =
            document.getElementById(
                "budgetMonth"
            );

        const now =
            new Date();

        const month =
            now.getFullYear()
            + "-"
            + String(
                now.getMonth() + 1
            ).padStart(
                2,
                "0"
            );

        input.value =
            month;

    }


    /* ==========================================
       API FETCH HELPER
    ========================================== */

    async function apiFetch(
        url,
        options = {}
    ) {

        const finalOptions = {

            ...options,

            credentials:
                "same-origin",

            headers: {

                ...(options.headers || {})

            }

        };

        const response =
            await fetch(
                url,
                finalOptions
            );

        let data = {};

        try {

            data =
                await response.json();

        } catch {

            data = {};

        }

        if (
            response.status === 401
        ) {

            window.location.href =
                "/login";

            return null;

        }

        return {
            response,
            data
        };

    }


    /* ==========================================
       LOAD BUDGETS + TRANSACTIONS
    ========================================== */

    async function loadBudgets() {

        const loading =
            document.getElementById(
                "loadingState"
            );

        const grid =
            document.getElementById(
                "budgetGrid"
            );

        try {

            loading.style.display =
                "block";

            grid.style.display =
                "none";


            /* ==============================
               LOAD BUDGETS
            ============================== */

            const budgetResult =
                await apiFetch(
                    "/api/budgets"
                );

            if (!budgetResult) {
                return;
            }

            const budgetResponse =
                budgetResult.response;

            const budgetData =
                budgetResult.data;


            if (!budgetResponse.ok) {

                throw new Error(
                    budgetData.error ||
                    "Could not load budgets."
                );

            }


            budgets =
                budgetData.budgets || [];


            /* ==============================
               LOAD TRANSACTIONS
            ============================== */

            const transactionResult =
                await apiFetch(
                    "/api/transactions"
                );

            if (!transactionResult) {
                return;
            }

            const transactionResponse =
                transactionResult.response;

            const transactionData =
                transactionResult.data;


            if (!transactionResponse.ok) {

                throw new Error(
                    transactionData.error ||
                    "Could not load transactions."
                );

            }


            transactions =
                transactionData.transactions || [];


            loading.style.display =
                "none";

            grid.style.display =
                "grid";


            renderBudgets();

        }

        catch (error) {

            console.error(
                error
            );

            loading.style.display =
                "none";

            showError(
                error.message
            );

        }

    }


    /* ==========================================
       ACTUAL SPENDING
    ========================================== */

    function getActualSpending(
        category,
        month
    ) {

        let total = 0;


        transactions.forEach(
            transaction => {

                if (
                    transaction.category !==
                    category
                ) {
                    return;
                }


                if (
                    transaction.type !==
                    "expense"
                ) {
                    return;
                }


                if (
                    !String(
                        transaction.date
                    ).startsWith(
                        month
                    )
                ) {
                    return;
                }


                total += Math.abs(
                    Number(
                        transaction.amount
                    )
                );

            }
        );


        return total;

    }


    /* ==========================================
       RENDER BUDGETS
    ========================================== */

    function renderBudgets() {

        const grid =
            document.getElementById(
                "budgetGrid"
            );

        const empty =
            document.getElementById(
                "emptyState"
            );


        grid.innerHTML =
            "";


        if (
            budgets.length === 0
        ) {

            grid.style.display =
                "none";

            empty.style.display =
                "block";

            return;

        }


        grid.style.display =
            "grid";

        empty.style.display =
            "none";


        budgets.forEach(
            budget => {

                const actual =
                    getActualSpending(
                        budget.category,
                        budget.month
                    );


                const budgetAmount =
                    Number(
                        budget.amount
                    );


                const percentage =
                    budgetAmount > 0
                    ? (
                        actual /
                        budgetAmount
                    ) * 100
                    : 0;


                const progress =
                    Math.min(
                        percentage,
                        100
                    );


                let status;

                let statusClass;


                if (
                    percentage > 100
                ) {

                    status =
                        `⚠️ Over budget by ${
                            formatMoney(
                                actual -
                                budgetAmount
                            )
                        }`;

                    statusClass =
                        "danger";

                }

                else if (
                    percentage >= 80
                ) {

                    status =
                        `⚠️ ${
                            Math.round(
                                percentage
                            )
                        }% of budget used`;

                    statusClass =
                        "warning";

                }

                else {

                    status =
                        `✓ ${
                            Math.round(
                                percentage
                            )
                        }% of budget used`;

                    statusClass =
                        "safe";

                }


                const card =
                    document.createElement(
                        "div"
                    );


                card.className =
                    "budget-card";


                card.innerHTML = `

                    <div class="budget-card-header">

                        <h3>
                            ${escapeHtml(
                                budget.category
                            )}
                        </h3>

                        <button
                            class="delete-budget"
                            onclick="deleteBudget(
                                ${Number(budget.id)}
                            )"
                            type="button"
                        >
                            🗑️
                        </button>

                    </div>


                    <div class="budget-numbers">

                        <div class="budget-number">

                            <small>
                                Budget
                            </small>

                            <strong>
                                ${formatMoney(
                                    budgetAmount
                                )}
                            </strong>

                        </div>


                        <div class="budget-number">

                            <small>
                                Spent
                            </small>

                            <strong>
                                ${formatMoney(
                                    actual
                                )}
                            </strong>

                        </div>

                    </div>


                    <div class="progress-container">

                        <div
                            class="progress-bar ${statusClass}"
                            style="width:${progress}%"
                        ></div>

                    </div>


                    <div class="budget-status">

                        ${status}

                    </div>


                    <div class="month-label">

                        📅 ${escapeHtml(
                            budget.month
                        )}

                    </div>

                `;


                grid.appendChild(
                    card
                );

            }
        );

    }


    /* ==========================================
       ESCAPE HTML
    ========================================== */

    function escapeHtml(
        text
    ) {

        const div =
            document.createElement(
                "div"
            );

        div.textContent =
            text ?? "";

        return div.innerHTML;

    }


    /* ==========================================
       SHOW ERROR
    ========================================== */

    function showError(
        message
    ) {

        const box =
            document.getElementById(
                "errorMessage"
            );

        box.innerText =
            "❌ " + message;

        box.style.display =
            "block";

    }


    /* ==========================================
       SAVE BUDGET
    ========================================== */

    async function saveBudget() {

        const category =
            document.getElementById(
                "budgetCategory"
            ).value;


        const amount =
            Number(
                document.getElementById(
                    "budgetAmount"
                ).value
            );


        const month =
            document.getElementById(
                "budgetMonth"
            ).value;


        const errorBox =
            document.getElementById(
                "errorMessage"
            );

        const saveButton =
            document.getElementById(
                "saveBudgetButton"
            );


        errorBox.style.display =
            "none";


        if (
            !amount ||
            amount <= 0
        ) {

            showError(
                "Please enter a valid budget amount."
            );

            return;

        }


        if (!month) {

            showError(
                "Please select a month."
            );

            return;

        }


        saveButton.disabled =
            true;

        saveButton.innerText =
            "Saving...";


        try {

            const result =
                await apiFetch(
                    "/api/budgets",
                    {

                        method:
                            "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body:
                            JSON.stringify({

                                category:
                                    category,

                                amount:
                                    amount,

                                month:
                                    month

                            })

                    }
                );


            if (!result) {
                return;
            }


            const response =
                result.response;

            const data =
                result.data;


            if (!response.ok) {

                throw new Error(
                    data.error ||
                    "Could not save budget."
                );

            }


            document.getElementById(
                "budgetAmount"
            ).value =
                "";


            await loadBudgets();

        }

        catch (error) {

            console.error(
                error
            );

            showError(
                error.message
            );

        }

        finally {

            saveButton.disabled =
                false;

            saveButton.innerText =
                "💾 Save Budget";

        }

    }


    /* ==========================================
       DELETE BUDGET
    ========================================== */

    async function deleteBudget(
        id
    ) {

        const confirmed =
            confirm(
                "Are you sure you want to delete this budget?"
            );


        if (!confirmed) {
            return;
        }


        try {

            const result =
                await apiFetch(
                    `/api/budgets/${id}`,
                    {
                        method:
                            "DELETE"
                    }
                );


            if (!result) {
                return;
            }


            const response =
                result.response;

            const data =
                result.data;


            if (!response.ok) {

                throw new Error(
                    data.error ||
                    "Could not delete budget."
                );

            }


            await loadBudgets();

        }

        catch (error) {

            console.error(
                error
            );

            showError(
                error.message
            );

        }

    }


    /* ==========================================
       START
    ========================================== */

    setCurrentMonth();

    setProfileInitial();

    loadBudgets();

</script>

</body>

</html>
