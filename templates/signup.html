<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Account | FinPilot</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        body {

            min-height: 100vh;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background:
                linear-gradient(
                    135deg,
                    #eef4ff,
                    #f8fbff
                );

            display: flex;

            align-items: center;

            justify-content: center;

            padding: 24px;

            color: #172033;

        }


        .auth-wrap {

            width: 100%;

            max-width: 450px;

        }


        .brand {

            text-align: center;

            margin-bottom: 18px;

        }


        .brand h1 {

            font-size: 34px;

            font-weight: 800;

            letter-spacing: -1px;

        }


        .brand span {

            color: #3563e9;

        }


        .brand p {

            margin-top: 7px;

            color: #6b7280;

            font-size: 14px;

        }


        .card {

            background:
                rgba(
                    255,
                    255,
                    255,
                    0.96
                );

            border:
                1px solid #e5eaf2;

            border-radius: 22px;

            padding: 30px;

            box-shadow:
                0 18px 55px
                rgba(
                    32,
                    52,
                    89,
                    0.12
                );

        }


        .card h2 {

            font-size: 24px;

            margin-bottom: 7px;

        }


        .subtitle {

            color: #6b7280;

            font-size: 14px;

            margin-bottom: 24px;

        }


        .error {

            background: #fff0f0;

            color: #c62828;

            border:
                1px solid #ffd3d3;

            padding:
                11px 13px;

            border-radius: 10px;

            margin-bottom: 16px;

            font-size: 14px;

        }


        .field {

            margin-bottom: 15px;

        }


        .field label {

            display: block;

            margin-bottom: 7px;

            font-size: 13px;

            font-weight: 700;

            color: #374151;

        }


        .field input {

            width: 100%;

            height: 48px;

            border:
                1px solid #d9e0ea;

            border-radius: 12px;

            padding:
                0 14px;

            font-size: 15px;

            outline: none;

        }


        .field input:focus {

            border-color: #3563e9;

            box-shadow:
                0 0 0 3px
                rgba(
                    53,
                    99,
                    233,
                    0.10
                );

        }


        .hint {

            font-size: 12px;

            color: #808897;

            margin-top: 6px;

        }


        .btn {

            width: 100%;

            height: 49px;

            border: none;

            border-radius: 12px;

            background: #3563e9;

            color: white;

            font-size: 15px;

            font-weight: 700;

            cursor: pointer;

            margin-top: 6px;

        }


        .btn:hover {

            background: #2d55c9;

        }


        .btn:disabled {

            opacity: 0.7;

            cursor: not-allowed;

        }


        .message {

            min-height: 20px;

            text-align: center;

            margin-top: 12px;

            font-size: 14px;

        }


        .footer {

            text-align: center;

            margin-top: 20px;

            color: #6b7280;

            font-size: 14px;

        }


        .footer a {

            color: #3563e9;

            text-decoration: none;

            font-weight: 700;

        }

    </style>

</head>


<body>


<div class="auth-wrap">


    <div class="brand">

        <h1>
            Fin<span>Pilot</span>
        </h1>

        <p>
            Your personal finance decision support agent
        </p>

    </div>


    <div class="card">


        <h2>
            Create your account
        </h2>


        <p class="subtitle">
            Start managing your finances with FinPilot.
        </p>


        {% if error %}

            <div class="error">
                {{ error }}
            </div>

        {% endif %}


        <form id="signupForm">


            <div class="field">

                <label for="name">
                    Full Name
                </label>

                <input
                    type="text"
                    id="name"
                    name="name"
                    placeholder="Your name"
                    required
                >

            </div>


            <div class="field">

                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="you@example.com"
                    required
                >

            </div>


            <div class="field">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Minimum 6 characters"
                    minlength="6"
                    required
                >

                <div class="hint">
                    Use at least 6 characters.
                </div>

            </div>


            <div class="field">

                <label for="confirmPassword">
                    Confirm Password
                </label>

                <input
                    type="password"
                    id="confirmPassword"
                    name="confirm_password"
                    placeholder="Re-enter your password"
                    minlength="6"
                    required
                >

            </div>


            <button
                type="submit"
                class="btn"
                id="signupBtn"
            >
                Create Account
            </button>


            <div
                class="message"
                id="message"
            ></div>


        </form>


        <div class="footer">

            Already have an account?

            <a href="/login">
                Login
            </a>

        </div>


    </div>


</div>


<script>


    const form =
        document.getElementById(
            "signupForm"
        );


    const btn =
        document.getElementById(
            "signupBtn"
        );


    const message =
        document.getElementById(
            "message"
        );


    form.addEventListener(
        "submit",
        async function(event) {


            event.preventDefault();


            const name =
                document
                    .getElementById("name")
                    .value
                    .trim();


            const email =
                document
                    .getElementById("email")
                    .value
                    .trim();


            const password =
                document
                    .getElementById("password")
                    .value;


            const confirmPassword =
                document
                    .getElementById(
                        "confirmPassword"
                    )
                    .value;


            if (
                password !==
                confirmPassword
            ) {

                message.style.color =
                    "#c62828";

                message.textContent =
                    "Passwords do not match.";

                return;

            }


            btn.disabled = true;

            btn.textContent =
                "Creating account...";

            message.textContent = "";


            try {


                const response =
                    await fetch(
                        "/signup",
                        {

                            method:
                                "POST",

                            headers: {

                                "Content-Type":
                                    "application/json"

                            },

                            body:
                                JSON.stringify({

                                    name:
                                        name,

                                    email:
                                        email,

                                    password:
                                        password,

                                    confirm_password:
                                        confirmPassword

                                })

                        }
                    );


                const data =
                    await response.json();


                if (
                    response.ok &&
                    data.success
                ) {


                    message.style.color =
                        "#198754";


                    message.textContent =
                        "Account created. Redirecting...";


                    window.location.href =
                        data.redirect ||
                        "/dashboard";


                    return;

                }


                message.style.color =
                    "#c62828";


                message.textContent =
                    data.error ||
                    "Could not create account.";


            } catch (error) {


                message.style.color =
                    "#c62828";


                message.textContent =
                    "Could not connect to FinPilot.";


            } finally {


                btn.disabled = false;

                btn.textContent =
                    "Create Account";


            }

        }
    );

</script>


</body>
</html>
